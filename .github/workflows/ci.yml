name: Citizen Grievance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check core nlp ml analytics notifications ui scripts tests app.py

      - name: Syntax check all Python files
        run: python -m compileall -q core nlp ml analytics notifications ui scripts tests app.py

      - name: Run full unit and security test suite
        env:
          CGS_SEED_PASSWORD: CiSeedPassword@2026
          CGS_DAILY_SUBMISSION_LIMIT: "50"
          CGS_SUBMISSION_COOLDOWN_SECONDS: "0"
        run: python -m unittest discover -s tests -v
